<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Maritime Law Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#010812; --surface:#061828; --card:#0a2040; --border:rgba(16,80,160,0.25);
  --fg:#b0cce8; --white:#e4f0fc; --mist:#7090b8; --fog:#3a5878;
  --gold:#c89010; --gold-m:#e0aa20; --gold-hi:#f8cc48;
  --signal:#00d8ff; --steel:#1a6ac8; --sky:#2888e8;
  --correct:#00c87a; --wrong:#e03050;
  --rule-bg:rgba(0,216,255,0.06); --rule-bdr:rgba(0,216,255,0.22);
  --font-en:'Barlow Condensed',sans-serif; --font-ar:'Tajawal',sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-ar);background:var(--bg);color:var(--fg);min-height:100%;overflow-x:hidden}
#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.page{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:32px 20px 80px}
.header{text-align:center;margin-bottom:36px}
.header-badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-en);font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gold-m);border:1px solid rgba(200,144,16,.3);background:rgba(200,144,16,.06);padding:5px 18px;border-radius:20px;margin-bottom:16px}
.badge-dot{width:5px;height:5px;border-radius:50%;background:var(--gold-m);box-shadow:0 0 6px var(--gold-m)}
.header h1{font-family:var(--font-en);font-size:clamp(26px,5.5vw,44px);font-weight:800;color:var(--white);letter-spacing:1px;line-height:1;margin-bottom:6px}
.header h1 em{font-style:normal;color:var(--gold-hi)}
.header-sub{font-family:var(--font-ar);font-size:13px;color:var(--signal);margin-bottom:24px;direction:rtl}
.controls{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:28px}
.ctrl-left{display:flex;align-items:center;gap:10px}
.q-counter{font-family:var(--font-en);font-size:13px;letter-spacing:1px;color:var(--mist)}
.q-counter strong{color:var(--white);font-size:16px}
.timer-wrap{display:flex;align-items:center;gap:8px}
.timer-ring{position:relative;width:44px;height:44px}
.timer-ring svg{transform:rotate(-90deg)}
.timer-ring circle{fill:none;stroke-width:3}
.timer-track{stroke:rgba(16,80,160,.3)}
.timer-arc{stroke:var(--signal);stroke-linecap:round;transition:stroke-dashoffset .9s linear,stroke .3s}
.timer-val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-en);font-size:13px;font-weight:700;color:var(--white)}
.score-pill{font-family:var(--font-en);font-size:12px;font-weight:700;letter-spacing:1.5px;padding:5px 14px;border-radius:20px;border:1px solid rgba(200,144,16,.3);background:rgba(200,144,16,.08);color:var(--gold-hi)}
.btn-shuffle{font-family:var(--font-en);font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:8px 20px;border-radius:10px;cursor:pointer;border:1px solid rgba(26,106,200,.35);background:rgba(26,106,200,.15);color:var(--sky);transition:background .2s,border-color .2s}
.btn-shuffle:hover{background:rgba(26,106,200,.28);border-color:rgba(40,136,232,.6)}
.progress-bar{height:3px;border-radius:2px;background:rgba(16,80,160,.2);margin-bottom:28px;overflow:hidden}
.progress-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--steel),var(--signal));transition:width .4s ease}
.q-card{background:linear-gradient(145deg,rgba(6,24,40,.95),rgba(10,32,64,.9));border:1px solid var(--border);border-radius:20px;overflow:hidden;position:relative;animation:cardIn .45s cubic-bezier(.16,1,.3,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.q-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--steel),var(--signal),var(--sky))}
.q-card-inner{padding:32px 28px 28px}
.q-num{font-family:var(--font-en);font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--signal);margin-bottom:14px;display:block}
.q-source{font-family:var(--font-en);font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:3px 10px;border-radius:20px;margin-bottom:14px;display:inline-block}
.q-source.marpol{background:rgba(0,200,122,.1);border:1px solid rgba(0,200,122,.3);color:var(--correct)}
.q-source.solas{background:rgba(0,216,255,.1);border:1px solid rgba(0,216,255,.3);color:var(--signal)}
.q-source.isps{background:rgba(248,204,72,.1);border:1px solid rgba(248,204,72,.3);color:var(--gold-hi)}
.q-source.stcw{background:rgba(200,100,255,.1);border:1px solid rgba(200,100,255,.3);color:#d090ff}
.q-source.mlc{background:rgba(255,140,60,.1);border:1px solid rgba(255,140,60,.3);color:#ff9a50}
.q-source.ism{background:rgba(255,80,120,.1);border:1px solid rgba(255,80,120,.3);color:#ff6090}
.q-source.law{background:rgba(100,180,255,.1);border:1px solid rgba(100,180,255,.3);color:#80c4ff}
.q-source.imo{background:rgba(80,220,180,.1);border:1px solid rgba(80,220,180,.3);color:#50e0b0}
.q-text{font-size:clamp(15px,2.5vw,17px);font-weight:600;color:var(--white);line-height:1.8;margin-bottom:28px;direction:rtl;text-align:right}
.options{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:14px;padding:14px 18px;border-radius:12px;cursor:pointer;background:rgba(6,24,40,.6);border:1px solid rgba(16,80,160,.2);transition:border-color .2s,background .2s,transform .15s;font-size:14px;color:var(--fg);direction:rtl;text-align:right;line-height:1.6}
.opt:hover:not(.disabled){border-color:rgba(40,136,232,.5);background:rgba(10,40,80,.7);transform:translateX(3px)}
.opt.disabled{cursor:default}
.opt-letter{font-family:var(--font-en);font-size:12px;font-weight:700;letter-spacing:1px;width:24px;height:24px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(16,80,160,.2);border:1px solid rgba(16,80,160,.35);color:var(--sky);margin-top:2px;transition:background .2s,border-color .2s;order:2}
.opt span:first-child{order:1}
.opt.correct{background:rgba(0,200,122,.1);border-color:rgba(0,200,122,.45)}
.opt.correct .opt-letter{background:var(--correct);border-color:var(--correct);color:#000}
.opt.wrong{background:rgba(224,48,80,.1);border-color:rgba(224,48,80,.45)}
.opt.wrong .opt-letter{background:var(--wrong);border-color:var(--wrong);color:#fff}
.rule-panel{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--rule-bg);border:1px solid var(--rule-bdr);display:none}
.rule-panel.show{display:block;animation:fadeUp .35s .1s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.rule-panel-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.rule-badge{font-family:var(--font-en);font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--signal);background:rgba(0,216,255,.1);border:1px solid rgba(0,216,255,.25);padding:3px 10px;border-radius:20px;white-space:nowrap}
.page-badge{font-family:var(--font-en);font-size:10px;font-weight:700;letter-spacing:1px;color:var(--gold-m);background:rgba(200,144,16,.08);border:1px solid rgba(200,144,16,.25);padding:3px 10px;border-radius:20px;white-space:nowrap}
.rule-text{font-size:13px;color:var(--fg);line-height:1.8;direction:rtl;text-align:right}
.btn-next{width:100%;margin-top:22px;font-family:var(--font-en);font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:14px;border-radius:12px;border:none;cursor:pointer;background:linear-gradient(135deg,rgba(16,80,160,.35),rgba(26,106,200,.3));border:1px solid rgba(26,106,200,.4);color:var(--sky);transition:background .2s,border-color .2s;display:none}
.btn-next:hover{background:linear-gradient(135deg,rgba(16,80,160,.55),rgba(26,106,200,.5));border-color:rgba(40,136,232,.7)}
.btn-next.show{display:block;animation:fadeUp .3s .15s both}
.results{text-align:center;display:none;animation:cardIn .5s cubic-bezier(.16,1,.3,1)}
.results.show{display:block}
.results-ring{margin:0 auto 24px;width:130px;height:130px;position:relative}
.results-ring svg{transform:rotate(-90deg)}
.results-ring circle{fill:none;stroke-width:9}
.results-score-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rs-num{font-family:var(--font-en);font-size:38px;font-weight:800;color:var(--white);line-height:1}
.rs-denom{font-family:var(--font-en);font-size:14px;color:var(--mist);margin-top:2px}
.results h2{font-family:var(--font-en);font-size:28px;font-weight:800;color:var(--white);margin-bottom:8px}
.results-grade{font-family:var(--font-en);font-size:16px;letter-spacing:2px;text-transform:uppercase;color:var(--gold-m);margin-bottom:28px}
.results-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}
.rstat{background:rgba(6,24,40,.8);border:1px solid var(--border);border-radius:14px;padding:16px 10px}
.rstat-val{font-family:var(--font-en);font-size:28px;font-weight:800;color:var(--white)}
.rstat-lbl{font-size:11px;color:var(--fog);margin-top:4px}
.weak-rules-section{margin-bottom:28px;text-align:right;direction:rtl;background:rgba(224,48,80,.06);border:1px solid rgba(224,48,80,.2);border-radius:16px;padding:20px 20px 18px;display:none}
.weak-rules-section.show{display:block}
.weak-rules-title{font-size:16px;font-weight:700;color:var(--wrong);margin-bottom:4px}
.weak-rules-sub{font-size:12px;color:var(--fog);margin-bottom:16px}
.weak-rule-item{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;text-align:right;direction:rtl}
.weak-rule-num{font-family:var(--font-en);font-size:11px;font-weight:700;letter-spacing:1px;color:var(--signal);background:rgba(0,216,255,.08);border:1px solid rgba(0,216,255,.2);padding:2px 10px;border-radius:20px;white-space:nowrap;flex-shrink:0;margin-top:2px}
.weak-rule-name{font-size:13px;color:var(--fg);line-height:1.6}
.btn-restart{font-family:var(--font-en);font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:14px 40px;border-radius:12px;border:none;cursor:pointer;background:linear-gradient(135deg,rgba(200,144,16,.2),rgba(248,204,72,.15));border:1px solid rgba(200,144,16,.4);color:var(--gold-hi);transition:background .2s}
.btn-restart:hover{background:linear-gradient(135deg,rgba(200,144,16,.38),rgba(248,204,72,.3))}
.timeout-flash{position:fixed;inset:0;z-index:50;pointer-events:none;background:rgba(224,48,80,.12);opacity:0}
.timeout-flash.flash{animation:flashAnim .6s ease}
@keyframes flashAnim{0%,100%{opacity:0}30%{opacity:1}}
@media(max-width:520px){.q-card-inner{padding:22px 16px 18px}.opt{padding:12px 14px;font-size:13px}.controls{flex-direction:column;align-items:flex-start}.results-grid{grid-template-columns:repeat(3,1fr);gap:8px}}
</style>

<canvas id="bgCanvas"></canvas>
<div class="timeout-flash" id="timeoutFlash"></div>

</div>

<script>
/* ── STAR BACKGROUND ── */
(function(){
  const c=document.getElementById('bgCanvas'),ctx=c.getContext('2d');
  let W,H,stars=[];
  function resize(){W=c.width=innerWidth;H=c.height=innerHeight;stars=Array.from({length:140},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+.2,a:Math.random(),s:Math.random()*.4+.1}))}
  resize();window.addEventListener('resize',resize);
  function tick(){ctx.clearRect(0,0,W,H);stars.forEach(s=>{s.a+=s.s*.012;if(s.a>1)s.s*=-1;if(s.a<0){s.s*=-1;s.x=Math.random()*W;s.y=Math.random()*H}ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);ctx.fillStyle=`rgba(180,220,255,${s.a*.7})`;ctx.fill()});requestAnimationFrame(tick)}
  tick();
})();

/* ── TOPIC NAMES ── */
const TOPICS = {
  'law-intro':    'مصادر وأهمية القانون البحري',
  'navigation':   'أنواع الملاحة البحرية',
  'imo':          'المنظمة البحرية الدولية IMO',
  'ship-id':      'العلامات المميزة للسفينة والاسم',
  'nationality':  'موطن وجنسية السفينة',
  'registration': 'تسجيل السفينة وشهادة التسجيل',
  'inspection':   'معاينة السفينة',
  'isps':         'مدونة ISPS',
  'stcw':         'اتفاقية STCW',
  'mlc':          'اتفاقية العمل البحري MLC',
  'marpol':       'اتفاقية MARPOL',
  'ism':          'نظام إدارة السلامة ISM',
};

/* ── QUESTION BANK ── */
const BANK = [
  // ══ القانون البحري – مصادر وأهمية ══
  {q:"ما هي أنواع القانون البحري؟",opts:["القانون البحري المدني، التجاري، الدولي","القانون البحري الإداري، المدني، البيئي","القانون البحري الدولي العام، الإداري، الجنائي","القانون البحري الخاص، العام، الجنائي"],a:2,topic:'law-intro',src:'القانون البحري',page:'مصادر وأهمية',ruleText:"القانون البحري يشمل: القانون البحري الدولي العام، الإداري، الجنائي."},
  {q:"القانون البحري يهتم بشكل أساسي بـ:",opts:["تنظيم الملاحة النهرية","ضبط العلاقات بين الدول البحرية فقط","تنظيم إدارة وتشغيل السفن وصلاحيتها والبيئة البحرية","تسجيل السفن فقط"],a:2,topic:'law-intro',src:'القانون البحري',page:'مصادر وأهمية',ruleText:"القانون البحري يهتم بشكل أساسي بتنظيم إدارة وتشغيل السفن وصلاحيتها والبيئة البحرية."},
  {q:"لا يمكن أداء الرحلة البحرية على أكمل وجه دون:",opts:["خبرة الطاقم في الطقس فقط","دراية كاملة بالقانون البحري","استخدام سفن كبيرة","مراقبة مستمرة من الدولة"],a:1,topic:'law-intro',src:'القانون البحري',page:'مصادر وأهمية',ruleText:"لا يمكن أداء الرحلة البحرية على أكمل وجه دون دراية كاملة بالقانون البحري."},
  {q:"ما هو تعريف القانون البحري؟",opts:["هو قانون تنظيم الموانئ","هو القانون الخاص بالتجارة البحرية فقط","مجموعة القواعد القانونية التي تحكم الملاحة البحرية","القانون الذي ينظم العلاقات السياسية بين الدول البحرية"],a:2,topic:'law-intro',src:'القانون البحري',page:'مصادر وأهمية',ruleText:"القانون البحري هو مجموعة القواعد القانونية التي تحكم الملاحة البحرية."},
  {q:"ما هو تعريف الملاحة البحرية؟",opts:["هي الملاحة الجوية","الملاحة التي تتم في البحر بمنشآت عائمة عرضة لمخاطر البحر","الملاحة بين الأنهار فقط","ملاحة ناقلات النفط فقط"],a:1,topic:'law-intro',src:'القانون البحري',page:'مصادر وأهمية',ruleText:"الملاحة البحرية هي الملاحة التي تتم في البحر بمنشآت عائمة عرضة لمخاطر البحر."},

/* ── STATE ── */
let order=[],idx=0,score=0,timeouts=0,wrongs=0,wrongTopics={};
let timer=null,timeLeft=60;
const CIRC=2*Math.PI*19;

function shuffleArray(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a;}

function shuffleAndRestart(){
  order=shuffleArray(BANK.map((_,i)=>i));
  idx=0;score=0;timeouts=0;wrongs=0;wrongTopics={};
  document.getElementById('scoreDisplay').textContent=0;
  document.getElementById('scoreDenom').textContent=0;
  document.getElementById('quizArea').style.display='';
  document.getElementById('resultsScreen').classList.remove('show');
  loadQ();
}

function loadQ(){
  clearInterval(timer);timeLeft=60;
  const qi=order[idx],q=BANK[qi],total=order.length;
  document.getElementById('qNum').textContent=idx+1;
  document.getElementById('qTotal').textContent=total;
  document.getElementById('qNumBadge').textContent='Q '+String(idx+1).padStart(2,'0');
  const src=document.getElementById('qSource');
  src.textContent=q.src;
  const srcMap={'MARPOL':'marpol','SOLAS':'solas','ISPS':'isps','STCW':'stcw','MLC':'mlc','ISM':'ism','IMO':'imo','القانون البحري':'law'};
  src.className='q-source '+(srcMap[q.src]||'law');
  document.getElementById('qText').textContent=q.q;
  document.getElementById('progressFill').style.width=((idx/total)*100)+'%';
  const opts=document.getElementById('optionsContainer');
  opts.innerHTML='';
  q.opts.forEach((o,i)=>{
    const d=document.createElement('div');
    d.className='opt';d.dataset.i=i;
    d.innerHTML=`<span>${o}</span><span class="opt-letter">${['A','B','C'][i]}</span>`;
    d.onclick=()=>answer(i,q);
    opts.appendChild(d);
  });
  document.getElementById('rulePanel').classList.remove('show');
  document.getElementById('btnNext').classList.remove('show');
  updateTimer();
  timer=setInterval(()=>{
    timeLeft--;updateTimer();
    if(timeLeft<=0){clearInterval(timer);onTimeout(q);}
  },1000);
}

function updateTimer(){
  const pct=timeLeft/60;
  const arc=document.getElementById('timerArc');
  arc.style.strokeDashoffset=CIRC*(1-pct);
  arc.style.stroke=timeLeft<=10?'var(--wrong)':timeLeft<=20?'var(--gold-m)':'var(--signal)';
  document.getElementById('timerVal').textContent=timeLeft;
}

function answer(i,q){
  clearInterval(timer);
  document.querySelectorAll('.opt').forEach(d=>{
    d.classList.add('disabled');
    const di=parseInt(d.dataset.i);
    if(di===q.a)d.classList.add('correct');
    else if(di===i&&i!==q.a)d.classList.add('wrong');
  });
  const answered=document.getElementById('scoreDenom');
  answered.textContent=parseInt(answered.textContent)+1;
  if(i===q.a){score++;document.getElementById('scoreDisplay').textContent=score;}
  else{wrongs++;wrongTopics[q.topic]=(wrongTopics[q.topic]||0)+1;}
  showRulePanel(q);
  document.getElementById('btnNext').classList.add('show');
}

function onTimeout(q){
  timeouts++;
  wrongTopics[q.topic]=(wrongTopics[q.topic]||0)+1;
  document.querySelectorAll('.opt').forEach(d=>{
    d.classList.add('disabled');
    if(parseInt(d.dataset.i)===q.a)d.classList.add('correct');
  });
  const f=document.getElementById('timeoutFlash');
  f.className='timeout-flash flash';
  setTimeout(()=>{f.className='timeout-flash'},700);
  const ans=document.getElementById('scoreDenom');
  ans.textContent=parseInt(ans.textContent)+1;
  showRulePanel(q);
  document.getElementById('btnNext').classList.add('show');
}

function showRulePanel(q){
  document.getElementById('ruleBadge').textContent=q.src+' — '+q.topic.split('-').slice(1).join(' ').toUpperCase();
  document.getElementById('pageBadge').textContent=q.page;
  document.getElementById('ruleText').textContent=q.ruleText;
  document.getElementById('rulePanel').classList.add('show');
}

function nextQ(){
  idx++;
  if(idx>=order.length){showResults();return;}
  loadQ();
}

function showResults(){
  clearInterval(timer);
  document.getElementById('quizArea').style.display='none';
  const rs=document.getElementById('resultsScreen');rs.classList.add('show');
  const total=order.length,pct=score/total;
  document.getElementById('rsNum').textContent=score;
  document.getElementById('rsDenom').textContent='/'+total;
  document.getElementById('rsCorrect').textContent=score;
  document.getElementById('rsWrong').textContent=wrongs;
  document.getElementById('rsTimeout').textContent=timeouts;
  const arc=document.getElementById('resultsArc');
  const c2=2*Math.PI*56;
  arc.style.strokeDashoffset=c2*(1-pct);
  arc.style.stroke=pct>=.8?'var(--correct)':pct>=.6?'var(--gold-m)':'var(--wrong)';
  const grade=pct>=.9?'EXCELLENT':pct>=.8?'VERY GOOD':pct>=.7?'GOOD':pct>=.6?'PASS':'NEEDS REVIEW';
  document.getElementById('resultsTitle').textContent=score+' / '+total;
  document.getElementById('resultsGrade').textContent=grade;
  const wk=document.getElementById('weakRulesSection');
  const wl=document.getElementById('weakRulesList');
  wl.innerHTML='';
  const entries=Object.entries(wrongTopics).sort((a,b)=>b[1]-a[1]);
  if(entries.length){
    wk.classList.add('show');
    entries.forEach(([t,c])=>{
      const d=document.createElement('div');d.className='weak-rule-item';
      d.innerHTML=`<span class="weak-rule-num">${c}✗</span><span class="weak-rule-name">${TOPICS[t]||t}</span>`;
      wl.appendChild(d);
    });
  }
}

shuffleAndRestart();
</script>
